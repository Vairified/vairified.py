[tool.uv]
package = true

[tool.ruff.lint]
select = ["I", "E", "F", "W"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[project]
name = "vairified"
version = "0.1.0"
maintainers = [
  {name = "Vivek Joshy", email = "vjoshy@vairified.com"}
]
description = "Official Python SDK for the Vairified Partner API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["vairified", "pickleball", "rating", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.urls]
Homepage = "https://vairified.com"
Documentation = "https://vairified.github.io/vairified.py"
Repository = "https://github.com/Vairified/vairified.py"
Issues = "https://github.com/Vairified/vairified.py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "respx>=0.22.0",
    "bump-my-version>=1.2.0",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.8.0",
    "sphinx-autodoc-typehints>=2.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vairified"]
